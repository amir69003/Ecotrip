version: '3.8'

services:
  # backend is a Java Spring Boot application java JDK 21 java 21 on debian-slim
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app

  # frontend is a React application in Vite (node latest lts: 22) on debian-slim
  frontend:
    image: node:22-slim
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend