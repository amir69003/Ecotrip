# CI/CD for Test and Deploy

stages:
  - test
  - deploy

test:
  stage: test
  image: maven:3-eclipse-temurin-21
  script:
    - echo "Running tests..."
    - touch .env
    - echo 'ENV=production' > .env
    - echo 'ENV_FILE=.env' >> .env
    - echo 'DB_NAME=$DB_NAME' >> .env
    - echo 'DB_HOST=$DB_HOST' >> .env
    - echo 'DB_USERNAME=$DB_USERNAME' >> .env
    - echo 'DB_PASSWORD=$DB_PASSWORD' >> .env
    - mvn clean test
    - echo "Tests passed!"

deploy:
  stage: deploy
  image: debian:bookworm-slim
  # only run on the main branch if push or merge request
  rules:
    - if: "($CI_PIPELINE_SOURCE == 'push' || $CI_PIPELINE_SOURCE == 'merge_request_event') && $CI_COMMIT_BRANCH == 'main'"
      when: always
  before_script:
    - mkdir -p ~/.ssh
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "$CI_SSH_KEY" | tr -d '\r' | ssh-add -
    - ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to production server..."
    - |
      ssh "$SERVER" "
        set -x -e
        if [ ! -d ~/projet-master ]; then
          git clone git@forge.univ-lyon1.fr:grp16/projet-master.git ~/projet-master
        fi
        cd ~/projet-master
        git fetch origin
        git reset --hard origin/main
        touch .env
        echo 'ENV=production' > .env
        echo 'ENV_FILE=.env' >> .env
        echo 'DB_NAME=$DB_NAME' >> .env
        echo 'DB_HOST=$DB_HOST' >> .env
        echo 'DB_USERNAME=$DB_USERNAME' >> .env
        echo 'DB_PASSWORD=$DB_PASSWORD' >> .env
        docker compose down
        docker compose up -d
      "
    - echo "Deployment completed!"